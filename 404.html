<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Constantino Edes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <!-- Absolute paths (/...) because this page is served from any missing URL -->
  <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <main>
    <header class="profile">
      <div class="avatar" id="avatar" aria-hidden="true">CE</div>
      <div class="who">
        <h1>404</h1>
        <p class="role">Page not found</p>
      </div>
      <theme-toggle></theme-toggle>
    </header>

    <p class="bio">This page doesn't exist or was moved.</p>
    <nav id="links" aria-label="Links">
      <a class="link" id="home" href="/">
        <span>Back to home</span>
        <span class="tile" aria-hidden="true" data-icon="home"></span>
      </a>
    </nav>
  </main>

  <footer>
    <p>© <span id="year">2026</span> Constantino Edes</p>
  </footer>

  <script type="module">
    import { drawBackground } from "/bg.js";
    import { background } from "/links.js";
    import { icon } from "/icons.js";
    drawBackground(background);
    document.querySelector('#home [data-icon]').innerHTML = icon("home");
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
