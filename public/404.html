<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Constantino Edes</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try { const theme = localStorage.getItem("theme"); if (theme) document.documentElement.dataset.theme = theme; } catch { /* private mode: keep the system theme */ }
  </script>
  <!-- Absolute paths (/...) because this page is served from any missing URL -->
  <link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <main>
    <header class="profile">
      <div class="who">
        <h1>404</h1>
        <p class="role">Page not found</p>
      </div>
      <theme-toggle></theme-toggle>
    </header>

    <p class="bio">This page doesn't exist or was moved.</p>
    <nav id="links" aria-label="Links">
      <a class="link contrast" id="home" href="/">
        <span>Back to home</span>
        <span class="tile" aria-hidden="true" data-icon="home"></span>
      </a>
    </nav>
  </main>

  <script type="module">
    import { drawBackground } from "/bg.js";
    import { icon } from "/icons.js";

    fetch("/data/site.json")
      .then((r) => r.json())
      .then(({ background }) => drawBackground(background))
      .catch(() => drawBackground({ style: "glow", grid: "floor", accent: "", accent2: "" }));
    document.querySelector('#home [data-icon]').innerHTML = icon("home");
  </script>
</body>
</html>
